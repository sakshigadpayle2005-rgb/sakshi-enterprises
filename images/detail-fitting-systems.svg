<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <rect width="1200" height="800" fill="#16171A"/>
  <!-- Architectural Blueprint Grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
  </g>

  <!-- Left Panel: Velcro-Based Perimeter System -->
  <rect x="60" y="80" width="500" height="640" fill="#1F2126" stroke="#3A3E47" stroke-width="2"/>
  <rect x="95" y="140" width="430" height="440" fill="#121316" stroke="#FF6B35" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- Fine Mesh Grid Inside Left Window -->
  <g stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1">
    <line x1="115" y1="160" x2="505" y2="160"/>
    <line x1="115" y1="190" x2="505" y2="190"/>
    <line x1="115" y1="220" x2="505" y2="220"/>
    <line x1="115" y1="250" x2="505" y2="250"/>
    <line x1="115" y1="280" x2="505" y2="280"/>
    <line x1="115" y1="310" x2="505" y2="310"/>
    <line x1="115" y1="340" x2="505" y2="340"/>
    <line x1="115" y1="370" x2="505" y2="370"/>
    <line x1="115" y1="400" x2="505" y2="400"/>
    <line x1="115" y1="430" x2="505" y2="430"/>
    <line x1="115" y1="460" x2="505" y2="460"/>
    <line x1="115" y1="490" x2="505" y2="490"/>
    <line x1="115" y1="520" x2="505" y2="520"/>
    <line x1="115" y1="550" x2="505" y2="550"/>
    <line x1="160" y1="150" x2="160" y2="570"/>
    <line x1="210" y1="150" x2="210" y2="570"/>
    <line x1="260" y1="150" x2="260" y2="570"/>
    <line x1="310" y1="150" x2="310" y2="570"/>
    <line x1="360" y1="150" x2="360" y2="570"/>
    <line x1="410" y1="150" x2="410" y2="570"/>
    <line x1="460" y1="150" x2="460" y2="570"/>
  </g>
  <!-- Peel Corner Detail -->
  <polygon points="525,470 525,580 415,580" fill="#2A2D35" stroke="#FF6B35" stroke-width="2"/>
  <text x="95" y="118" fill="#FF6B35" font-family="sans-serif" font-size="15" font-weight="bold" letter-spacing="3">01. VELCRO FITTING SYSTEM</text>
  <text x="95" y="630" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold">Perimeter Hook-and-Loop Tape</text>
  <text x="95" y="662" fill="#9CA3AF" font-family="sans-serif" font-size="14">Peel-and-wash detachable mosquito mesh border</text>

  <!-- Right Panel: Chain-Based Zippered System -->
  <rect x="640" y="80" width="500" height="640" fill="#1F2126" stroke="#3A3E47" stroke-width="2"/>
  <rect x="675" y="140" width="430" height="440" fill="#121316" stroke="#9CA3AF" stroke-width="3"/>
  <!-- Zippered Chain Track Highlight -->
  <line x1="695" y1="545" x2="1085" y2="545" stroke="#FF6B35" stroke-width="5" stroke-dasharray="6 4"/>
  <line x1="1070" y1="220" x2="1070" y2="545" stroke="#FF6B35" stroke-width="5" stroke-dasharray="6 4"/>
  <!-- Zipper Pull Slider Icon -->
  <rect x="1058" y="360" width="24" height="40" rx="4" fill="#FF6B35"/>
  <circle cx="1070" cy="380" r="5" fill="#1A1A1A"/>
  <text x="675" y="118" fill="#FF6B35" font-family="sans-serif" font-size="15" font-weight="bold" letter-spacing="3">02. CHAIN-BASED FITTING SYSTEM</text>
  <text x="675" y="630" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold">Integrated Chain / Zipper Access Track</text>
  <text x="675" y="662" fill="#9CA3AF" font-family="sans-serif" font-size="14">Reach window handles without removing the full screen</text>
</svg>
