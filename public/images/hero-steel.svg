<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <linearGradient id="bgWall" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141517"/>
      <stop offset="50%" stop-color="#1E2024"/>
      <stop offset="100%" stop-color="#0E0F11"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="1200" y1="0" x2="400" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#FF9E6D" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="steelBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#23262B"/>
      <stop offset="40%" stop-color="#585E68"/>
      <stop offset="55%" stop-color="#8A929E"/>
      <stop offset="100%" stop-color="#191B1F"/>
    </linearGradient>
    <linearGradient id="handrailSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9CA3AF"/>
      <stop offset="35%" stop-color="#4B5563"/>
      <stop offset="70%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="concreteSteps" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D3036"/>
      <stop offset="100%" stop-color="#16181C"/>
    </linearGradient>
  </defs>

  <!-- Architectural Dark Concrete & Shadow Background -->
  <rect width="1600" height="1000" fill="url(#bgWall)"/>
  <rect width="1600" height="1000" fill="url(#warmLight)"/>

  <!-- Subtle Architectural Elevation Grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="1000"/>
    <line x1="640" y1="0" x2="640" y2="1000"/>
    <line x1="960" y1="0" x2="960" y2="1000"/>
    <line x1="1280" y1="0" x2="1280" y2="1000"/>
  </g>

  <!-- Upper Mezzanine Balcony Slab & Steel Balcony Railing -->
  <rect x="620" y="340" width="980" height="42" fill="#181A1E" stroke="#374151" stroke-width="2"/>
  <line x1="620" y1="340" x2="1600" y2="340" stroke="#FF6B35" stroke-width="3" stroke-opacity="0.7"/>

  <!-- Upper Balcony Top Handrail -->
  <rect x="640" y="130" width="960" height="16" rx="3" fill="url(#handrailSteel)"/>
  <rect x="640" y="168" width="960" height="6" fill="#374151"/>
  <rect x="640" y="305" width="960" height="8" fill="#374151"/>

  <!-- Upper Balcony Vertical Precision Steel Balusters -->
  <g fill="url(#steelBar)">
    <rect x="650" y="146" width="14" height="194"/>
    <rect x="705" y="146" width="8" height="165"/>
    <rect x="755" y="146" width="8" height="165"/>
    <rect x="805" y="146" width="8" height="165"/>
    <rect x="855" y="146" width="8" height="165"/>
    <rect x="905" y="146" width="8" height="165"/>
    <rect x="955" y="146" width="14" height="194"/>
    <rect x="1010" y="146" width="8" height="165"/>
    <rect x="1060" y="146" width="8" height="165"/>
    <rect x="1110" y="146" width="8" height="165"/>
    <rect x="1160" y="146" width="8" height="165"/>
    <rect x="1210" y="146" width="8" height="165"/>
    <rect x="1260" y="146" width="14" height="194"/>
    <rect x="1315" y="146" width="8" height="165"/>
    <rect x="1365" y="146" width="8" height="165"/>
    <rect x="1415" y="146" width="8" height="165"/>
    <rect x="1465" y="146" width="8" height="165"/>
    <rect x="1515" y="146" width="14" height="194"/>
  </g>

  <!-- Cantilevered Architectural Staircase Treads Ascending Left-to-Right -->
  <g fill="url(#concreteSteps)" stroke="#4B5563" stroke-width="1.5">
    <rect x="80" y="890" width="220" height="32"/>
    <rect x="180" y="810" width="220" height="32"/>
    <rect x="280" y="730" width="220" height="32"/>
    <rect x="380" y="650" width="220" height="32"/>
    <rect x="480" y="570" width="220" height="32"/>
    <rect x="580" y="490" width="220" height="32"/>
    <rect x="680" y="410" width="240" height="32"/>
  </g>

  <!-- Diagonal Structural Steel Stringer Beam -->
  <polygon points="60,950 860,360 910,395 110,985" fill="#181A1F" stroke="#525866" stroke-width="2"/>
  <line x1="75" y1="958" x2="875" y2="368" stroke="#FF6B35" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Staircase Vertical Double-Bar Steel Balusters & Newel Posts -->
  <g fill="url(#steelBar)">
    <!-- Heavy Structural Newel Post Bottom -->
    <rect x="120" y="555" width="20" height="340"/>
    <!-- Intermediate Precision Balusters -->
    <rect x="185" y="510" width="9" height="305"/>
    <rect x="230" y="476" width="9" height="335"/>
    <rect x="285" y="435" width="9" height="300"/>
    <rect x="330" y="401" width="9" height="330"/>
    <rect x="385" y="360" width="9" height="295"/>
    <rect x="430" y="326" width="9" height="325"/>
    <rect x="485" y="285" width="18" height="290"/>
    <rect x="535" y="248" width="9" height="322"/>
    <rect x="585" y="210" width="9" height="285"/>
    <rect x="635" y="172" width="9" height="318"/>
    <rect x="685" y="135" width="9" height="280"/>
    <!-- Top Landing Structural Post -->
    <rect x="740" y="95" width="20" height="320"/>
  </g>

  <!-- Diagonal Brushed Stainless & Matte Black Steel Handrail -->
  <polygon points="95,575 765,80 778,98 108,593" fill="url(#handrailSteel)" stroke="#9CA3AF" stroke-width="1"/>
  <!-- Parallel Mid-Rail Tension Rod -->
  <line x1="115" y1="710" x2="755" y2="235" stroke="#9CA3AF" stroke-width="4"/>
  <line x1="115" y1="765" x2="755" y2="290" stroke="#6B7280" stroke-width="3"/>

  <!-- Precision Weld Node Highlights -->
  <g fill="#FF6B35">
    <circle cx="130" cy="575" r="4.5"/>
    <circle cx="494" cy="300" r="4.5"/>
    <circle cx="750" cy="108" r="4.5"/>
    <circle cx="657" cy="138" r="4.5"/>
    <circle cx="962" cy="138" r="4.5"/>
    <circle cx="1267" cy="138" r="4.5"/>
  </g>
</svg>
