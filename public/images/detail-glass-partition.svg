<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="glassPane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#93C5FD" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="#141619"/>
  <!-- Ceiling & Floor Tracks -->
  <rect x="60" y="70" width="1080" height="22" fill="#262930" stroke="#4B5563"/>
  <rect x="60" y="708" width="1080" height="22" fill="#262930" stroke="#4B5563"/>

  <!-- 4 Full-Height Aluminium Framed Glass Partition Modules -->
  <g stroke="#1A1A1A" stroke-width="10">
    <rect x="80" y="92" width="255" height="616" fill="url(#glassPane)" stroke="#374151" stroke-width="8"/>
    <rect x="345" y="92" width="255" height="616" fill="url(#glassPane)" stroke="#374151" stroke-width="8"/>
    <!-- Partition Door Module with Orange Architectural Handle -->
    <rect x="610" y="92" width="255" height="616" fill="url(#glassPane)" stroke="#FF6B35" stroke-width="4"/>
    <rect x="875" y="92" width="245" height="616" fill="url(#glassPane)" stroke="#374151" stroke-width="8"/>
  </g>

  <!-- Horizontal Transom Mullions -->
  <line x1="80" y1="240" x2="1120" y2="240" stroke="#374151" stroke-width="6"/>
  <line x1="80" y1="560" x2="600" y2="560" stroke="#374151" stroke-width="6"/>
  <line x1="875" y1="560" x2="1120" y2="560" stroke="#374151" stroke-width="6"/>

  <!-- Vertical Tubular Door Pull Handle -->
  <rect x="632" y="340" width="10" height="120" rx="3" fill="#FF6B35"/>

  <!-- Glass Reflection Diagonal Streaks -->
  <g stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2">
    <line x1="120" y1="300" x2="220" y2="160"/>
    <line x1="145" y1="320" x2="245" y2="180"/>
    <line x1="390" y1="480" x2="510" y2="310"/>
    <line x1="920" y1="420" x2="1030" y2="270"/>
  </g>

  <text x="80" y="52" fill="#FF6B35" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="3">ALUMINIUM FRAMED GLASS PARTITION SYSTEM • CUSTOM ELEVATION</text>
</svg>
