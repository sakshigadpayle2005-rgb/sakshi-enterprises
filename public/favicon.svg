<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer architectural window frame -->
  <rect x="4" y="4" width="56" height="56" rx="2" fill="#1A1A1A" stroke="#FF6B35" stroke-width="2.5"/>
  <!-- Inner structural mullion grid lines (subtle architectural crossbars) -->
  <line x1="32" y1="6" x2="32" y2="58" stroke="#333333" stroke-width="1.25"/>
  <line x1="6" y1="32" x2="58" y2="32" stroke="#333333" stroke-width="1.25"/>
  <!-- Inner recessed window frame border -->
  <rect x="10" y="10" width="44" height="44" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1"/>
  <!-- Geometric 'S' integrated in left pane -->
  <path d="M28 19H17V30.5H27V45H15.5" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Geometric 'E' integrated in right pane with orange architectural accent bar -->
  <path d="M48.5 19H36.5V45H48.5" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="square" stroke-linejoin="miter"/>
  <line x1="36.5" y1="32" x2="46.5" y2="32" stroke="#FF6B35" stroke-width="3.6" stroke-linecap="square"/>
